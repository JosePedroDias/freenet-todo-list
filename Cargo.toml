[workspace]
members = [
    "common",
    "contracts/todo-contract",
    "delegates/notes-delegate",
    "ui",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Freenet
freenet-stdlib = { version = "0.8.4", features = ["contract"] }
freenet-macros = "0.2.0"

# Shared types
todo-common = { path = "common" }

# Crypto (verification on wasm32); serde+alloc for Serialize/Deserialize of keys/sigs
ed25519-dalek = { version = "2", default-features = false, features = ["serde", "alloc"] }

# UI (wasm core, no framework)
web-sys = { version = "0.3", features = ["WebSocket", "MessageEvent", "Window", "Location", "BinaryType", "console"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
getrandom = { version = "0.2", features = ["js"], default-features = false }
log = "0.4"
bs58 = "0.5"
